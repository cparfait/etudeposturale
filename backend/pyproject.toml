[project]
name = "posturale"
version = "0.1.0"
description = "Étude posturale vélo : analyse vidéo locale, métriques et recommandations"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-multipart>=0.0.9",
    "opencv-contrib-python>=4.10",
    "fitdecode>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Moteur de pose RTMW sur la RTX 4090. cuDNN épinglé : la 9.28 fait échouer ONNX Runtime 1.23 (CUDNN_BACKEND_API_FAILED).
# Ne pas installer « onnxruntime » (CPU) en plus : il masque la version GPU.
gpu = ["rtmlib>=0.0.16", "onnxruntime-gpu[cuda,cudnn]==1.23.2", "nvidia-cudnn-cu12==9.10.2.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
