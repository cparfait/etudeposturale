    #intro-ground {
      position: absolute;
      inset: 0;
      background: radial-gradient(1200px 700px at 72% 30%, #2c4413 0%, rgba(44, 68, 19, 0) 70%),

  </style>

  <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
    <div id="intro-ground" class="clip" data-start="0" data-duration="7"></div>

    <div id="intro-stage" class="clip" data-start="0" data-duration="7" data-layout-allow-overflow>
      <svg id="intro-svg" viewBox="0 0 520 360" aria-label="Cycliste qui pédale, avec les pastilles et l'angle du genou mesuré">
        <defs>
          <radialGradient id="intro-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b8f34a" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#b8f34a" stop-opacity="0" />
          </radialGradient>
        </defs>
        <g id="intro-trainer" opacity="0">
          <line x1="40" y1="352" x2="500" y2="352" stroke="rgba(255,255,255,0.12)" />
          <path d="M84,350 L118,258 L152,350" stroke="rgba(255,255,255,0.22)" stroke-width="5" fill="none" stroke-linecap="round" />
        </g>
        <g id="intro-wheels" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5">
          <circle class="draw" pathLength="1" cx="118" cy="258" r="92" transform="rotate(-90 118 258)" />
          <circle class="draw" pathLength="1" cx="424" cy="258" r="92" transform="rotate(-90 424 258)" />

        </g>
        <g id="intro-frame" fill="none" stroke="#eef3ea" stroke-linecap="round" stroke-linejoin="round">
          <path id="intro-frame-main" class="draw" pathLength="1" stroke-width="7" />
          <path id="intro-fork" class="draw" pathLength="1" stroke-width="6" />
          <path id="intro-seatpost" class="draw" pathLength="1" stroke-width="5" />
          <path id="intro-stem" class="draw" pathLength="1" stroke-width="6" />

        </g>

    <div id="intro-hud" class="clip" data-start="1.6" data-duration="5.4">

    <div id="intro-copy" class="clip" data-start="3.7" data-duration="3.3">
      <h1 id="intro-title" data-var-text="title">Étude posturale</h1>
      <p id="intro-tagline" data-var-text="tagline">Ton bike fit à la maison, mesuré au degré près.</p>
      <span id="intro-badge"><i></i><span data-var-text="badge">100 % local</span></span>

  <script>
    (function () {
      // Géométrie du cycliste de l'application (frontend/src/components/bikeGeometry.ts), en coordonnées SVG 520 × 360.
      const rad = (d) => (d * Math.PI) / 180;
      const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
      const len = (a) => Math.hypot(a[0], a[1]);
      const pt = (p) => p[0].toFixed(1) + "," + p[1].toFixed(1);
      const seatDir = [-Math.cos(rad(73.5)), -Math.sin(rad(73.5))];
      const BB = [258, 276], REAR = [118, 258], FRONT = [424, 258], CRANK = 38;
      const along = (d) => add(BB, [seatDir[0] * d, seatDir[1] * d]);
      const SADDLE_TOP = along(204), SEAT_CLUSTER = along(158);
      const SADDLE_NOSE = add(SADDLE_TOP, [30, 1]), SADDLE_TAIL = add(SADDLE_TOP, [-28, -2]);
      const HEAD_TOP = [384, 126], HEAD_BOTTOM = [393, 168], STEM_END = [412, 118], HOODS = [436, 126];
      const HIP = add(SADDLE_TOP, [-6, -12]), THIGH = 124, SHANK = 126, ANKLE_OFFSET = [-7, -15];
      const SHOULDER = [322, 54], ELBOW = [372, 94], HEAD = [352, 30];

      const $ = (id) => document.getElementById(id);
      const attr = (id, k, v) => $(id).setAttribute(k, v);
      const line = (a, b) => "M" + pt(a) + " L" + pt(b);

      attr("intro-frame-main", "d", "M" + pt(BB) + " L" + pt(SEAT_CLUSTER) + " L" + pt(HEAD_TOP) + " L" + pt(HEAD_BOTTOM) + " Z M" + pt(BB) + " L" + pt(REAR) + " L" + pt(SEAT_CLUSTER));
      attr("intro-seatpost", "d", "M" + pt(SEAT_CLUSTER) + " L" + pt(add(SADDLE_TOP, [0, 6])));
      attr("intro-fork", "d", "M" + pt(HEAD_BOTTOM) + " Q404,220 " + pt(FRONT));
      attr("intro-stem", "d", "M" + pt(HEAD_TOP) + " L385,116 L" + pt(STEM_END));
      attr("intro-bar", "d", "M" + pt(STEM_END) + " C 432 114, 446 120, 444 136 C 442 152, 430 160, 418 158");
      attr("intro-saddle", "d", "M" + pt(SADDLE_TAIL) + " Q" + pt(add(SADDLE_TOP, [0, -4])) + " " + pt(SADDLE_NOSE) + " L" + pt(add(SADDLE_NOSE, [-4, 4])) + " Q" + pt(add(SADDLE_TOP, [-2, 5])) + " " + pt(add(SADDLE_TAIL, [2, 6])) + " Z");
      attr("intro-torso", "d", "M" + pt(HIP) + " Q 250 40 " + pt(SHOULDER));
      attr("intro-arm", "d", line(SHOULDER, ELBOW));
      attr("intro-forearm", "d", line(ELBOW, HOODS));
      attr("intro-head", "cx", HEAD[0]); attr("intro-head", "cy", HEAD[1]);

      function kneeFor(hip, ankle) {
        const d = sub(ankle, hip);
        const dist = Math.min(len(d), THIGH + SHANK - 0.001);
        const a = (THIGH * THIGH - SHANK * SHANK + dist * dist) / (2 * dist);
        const h = Math.sqrt(Math.max(THIGH * THIGH - a * a, 0));
        const u = [d[0] / len(d), d[1] / len(d)];
        const base = add(hip, [u[0] * a, u[1] * a]);
        const k1 = [base[0] - u[1] * h, base[1] + u[0] * h], k2 = [base[0] + u[1] * h, base[1] - u[0] * h];
        return k1[0] > k2[0] ? k1 : k2;
      }
      function legAt(th) {
        const pedal = [BB[0] + CRANK * Math.sin(rad(th)), BB[1] - CRANK * Math.cos(rad(th))];
        const ankle = add(pedal, ANKLE_OFFSET);
        const knee = kneeFor(HIP, ankle);
        const v1 = sub(HIP, knee), v2 = sub(ankle, knee);
        const cos = (v1[0] * v2[0] + v1[1] * v2[1]) / (len(v1) * len(v2));
        const flexion = 180 - (Math.acos(Math.max(-1, Math.min(1, cos))) * 180) / Math.PI;
        return { pedal, ankle, knee, heel: add(ankle, [-15, 8]), toe: add(pedal, [24, 2]), flexion };
      }
      function arc(c, from, to, r) {
        const a1 = Math.atan2(from[1] - c[1], from[0] - c[0]);
        let dl = Math.atan2(to[1] - c[1], to[0] - c[0]) - a1;
        while (dl > Math.PI) dl -= 2 * Math.PI;
        while (dl < -Math.PI) dl += 2 * Math.PI;
        const s = [c[0] + r * Math.cos(a1), c[1] + r * Math.sin(a1)], e = [c[0] + r * Math.cos(a1 + dl), c[1] + r * Math.sin(a1 + dl)];
        return "M" + pt(s) + " A" + r + "," + r + " 0 0 " + (dl > 0 ? 1 : 0) + " " + pt(e);
      }
      let minFlex = 180;
      for (let t = 0; t < 360; t++) minFlex = Math.min(minFlex, legAt(t).flexion);

      // Pose pour l'angle de manivelle θ : tout est fonction du temps de la timeline.
      function render(th) {
        const n = legAt(th), f = legAt(th + 180);
        attr("intro-thigh", "d", line(HIP, n.knee));
        attr("intro-shank", "d", line(n.knee, n.ankle));
        attr("intro-foot", "d", line(n.heel, n.toe));
        attr("intro-crank", "x1", BB[0]); attr("intro-crank", "y1", BB[1]);
        attr("intro-crank", "x2", n.pedal[0]); attr("intro-crank", "y2", n.pedal[1]);
        attr("intro-far-thigh", "d", line(HIP, f.knee));
        attr("intro-far-shank", "d", line(f.knee, f.ankle));
        attr("intro-far-foot", "d", line(f.heel, f.toe));
        attr("intro-far-crank", "x1", BB[0]); attr("intro-far-crank", "y1", BB[1]);
        attr("intro-far-crank", "x2", f.pedal[0]); attr("intro-far-crank", "y2", f.pedal[1]);
        const dir = sub(n.knee, HIP), ext = [n.knee[0] + dir[0] * 0.3, n.knee[1] + dir[1] * 0.3];
        attr("intro-m-thigh", "d", line(HIP, n.knee));
        attr("intro-m-shank", "d", line(n.knee, n.ankle));
        attr("intro-m-ext", "d", line(n.knee, ext));
        attr("intro-m-arc", "d", arc(n.knee, ext, n.ankle, 26));
        attr("intro-knee-glow", "cx", n.knee[0]); attr("intro-knee-glow", "cy", n.knee[1]);
        $("intro-knee-glow").style.opacity = n.flexion < minFlex + 4 && proxy.lit ? 1 : 0;
        const dots = { hip: HIP, knee: n.knee, ankle: n.ankle, shoulder: SHOULDER, elbow: ELBOW, bb: BB, pedal: n.pedal };
        for (const k in dots) { attr("intro-d-" + k, "cx", dots[k][0]); attr("intro-d-" + k, "cy", dots[k][1]); }
        $("intro-hud-val").textContent = Math.round(n.flexion) + "°";
      }

      // Pédalage : 0,9 s d'immobilité, puis 60 tours/min jusqu'à la fin.
      const proxy = { t: 0, lit: false };
      const theta = (t) => 168 + (t > 0.9 ? 360 * (t - 0.9) : 0);
      render(theta(0));

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(proxy, { t: 0 }, { t: 7, duration: 7, ease: "none", onUpdate: () => render(theta(proxy.t)) }, 0);

      // 1. Le vélo se dessine
      tl.fromTo("#intro-wheels circle", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut", stagger: 0.08 }, 0.15);
      tl.fromTo("#intro-frame .draw", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power3.out", stagger: 0.06 }, 0.35);
      tl.fromTo(["#intro-trainer", "#intro-saddle"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.7);
      // 2. Le cycliste apparaît et commence à pédaler
      tl.fromTo("#intro-body", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.8);
      tl.fromTo("#intro-far", { opacity: 0 }, { opacity: 0.32, duration: 0.45, ease: "power2.out" }, 0.8);
      // 3. Les pastilles se posent, une par une
      tl.fromTo("#intro-dots circle", { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.42, ease: "back.out(2)", stagger: 0.07, transformOrigin: "50% 50%" }, 1.15);
      // 4. La mesure s'affiche
      tl.fromTo("#intro-measure", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.6);
      tl.set(proxy, { lit: true }, 1.6);
      tl.fromTo("#intro-hud", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.62);
      // 5. La caméra laisse la place au nom de l'application
      tl.fromTo("#intro-stage", { x: 0, scale: 1 }, { x: -450, scale: 0.8, duration: 0.85, ease: "power2.inOut" }, 3.3);
      tl.fromTo("#intro-hud", { x: 0 }, { x: -200, duration: 0.85, ease: "power2.inOut" }, 3.3);
      tl.fromTo("#intro-title", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.85);
      tl.fromTo("#intro-tagline", { opacity: 0, color: "#3d4a36" }, { opacity: 1, color: "#b6c4ad", duration: 0.35, ease: "power2.out" }, 4.15);
      tl.fromTo("#intro-badge", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 4.6);

      window.__timelines["intro"] = tl;
    })();
  </script>
